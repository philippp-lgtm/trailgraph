name: cla

# The Contributor License Agreement check (CLA.md, CONTRIBUTING.md "Contributions and the CLA"): sets the commit
# status `cla` on a pull request from a fork; the logic is .github/scripts/cla_check.js. Signatures are recorded in
# signatures.json on the orphan branch cla-signatures, which is never merged or deleted.
# Pull requests from branches of this repository are skipped: pushing a branch needs write access, and whoever gets
# it signs the CLA first. So do not make `cla` a required status check; it is never set on such pull requests.
# pull_request_target runs this workflow as it is on the base branch, with a token that can write. It must never
# check out, build or run code from the pull request; the checkout below takes the base branch's scripts only.
# It always runs on ubuntu-24.04: never hand a self-hosted runner an event from outside the repository.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read

# One run at a time: two signatures at once would race on signatures.json.
concurrency:
  group: cla
  cancel-in-progress: false

jobs:
  cla:
    if: >-
      (github.event_name == 'pull_request_target'
        && github.event.pull_request.head.repo.full_name != github.repository)
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.login != github.repository_owner
        && (startsWith(github.event.comment.body, 'I have read the Contributor License Agreement')
          || github.event.comment.body == 'recheck'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # record a signature on the cla-signatures branch
      pull-requests: write   # comment on the pull request
      statuses: write        # set the `cla` status
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const check = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/cla_check.js`);
            core.info(`CLA check: ${await check({ github, context })}`);
