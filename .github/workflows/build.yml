name: build

# The container image of graph-server (Dockerfile target runtime), on a release tag only.
#   tag vX.Y.Z:  the tag equals the version of the three distributions, the tagged commit is
#                on main, the suite passes on the tagged tree (target test); then
#                ghcr.io/<owner>/<repository>:vX.Y.Z is pushed with GITHUB_TOKEN and its
#                digest goes to the job summary (deployments pin <tag>@sha256:<digest>)
# Releases: CONTRIBUTING.md, "CI and releases". Runs on CI_RUNS_ON like check.yml; on a runner
# of another architecture, the linux/amd64 image needs amd64 emulation (binfmt) in its Docker.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write   # push to GHCR with GITHUB_TOKEN
    steps:
      # fetch-depth 0 fetches every branch as origin/<branch>, so origin/main is
      # there for the ancestry check without a second fetch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Image name and version
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::tag $REF_NAME: expected vX.Y.Z" >&2; exit 1; }
          versions=$(sed -n 's/^version = "\(.*\)"$/\1/p' packages/*/pyproject.toml | sort -u)
          [ "$versions" = "${REF_NAME#v}" ] \
            || { echo "::error::tag $REF_NAME, distributions at: $(echo $versions)" >&2; exit 1; }
          # GHCR image names must be lowercase.
          echo "image=ghcr.io/${REPOSITORY,,}:${REF_NAME}" >> "$GITHUB_OUTPUT"

      # Tag builds only publish reviewed code: the tagged commit must be on main.
      - name: Require the tagged commit on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag commit $GITHUB_SHA is not on origin/main; merge it first, then tag" >&2; exit 1; }

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Test suite (Dockerfile target test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          push: false
          provenance: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          # Links the package to this repository (visibility and access follow it).
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: false   # keep the pushed manifest a plain image: its digest is the one deployments pin

      - name: Report
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "pushed: ${IMAGE}@${DIGEST}"
          { echo "### graph-server image"; echo; echo "\`${IMAGE}@${DIGEST}\`"; } >> "$GITHUB_STEP_SUMMARY"
