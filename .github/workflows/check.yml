name: check

# The gate on every pull request and every push to main.
#   lint:  ruff, ruff format, mypy and the import contracts (CONTRIBUTING.md, "Development")
#   test:  the suite on Linux as a non-root user (the Dockerfile's `test` stage), then
#          the runtime image: it builds, starts, answers /v1/health and its data root verifies.
#          A pull request runs the tests its change affects (scripts/select_tests.py, decided by
#          scripts/ci-select-tests.sh: the selector of the base branch, label ci:full forces everything;
#          a change to this workflow, its scripts or the Dockerfile controls its own run, so main runs it again);
#          a push to main and every other event run the whole suite, so it stays the gate of a release
#   object-store: tests/integration against a real S3-compatible store (the pinned Garage image,
#          tests/integration/run_garage.sh); the suite of `test` skips it
# All jobs only need Docker on the runner (no job containers, no `services:`), so they also run on
# a self-hosted runner: the repository variable CI_RUNS_ON holds the JSON runs-on value, e.g.
# ["self-hosted","linux"]; unset means ubuntu-24.04. A pull request from a fork always runs on
# ubuntu-24.04: never hand a self-hosted runner code from outside the repository.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # A push to main reuses a pull request run only when its test job ran the whole suite (scripts/ci-reuse-pr-run.sh):
  # job/step names that must have succeeded in that run. A run that tested a selection never counts.
  CI_REUSE_REQUIRE: 'test/Test suite (full)'
  # A pull request runs the workflow and scripts it carries: when it changed any of these, main runs the change itself.
  CI_REUSE_REFUSE_PATHS: '^(\.github/workflows/check\.yml|\.github/actions/|scripts/ci-|tests/ci-|Dockerfile$|\.dockerignore$)'

# A newer push to the same branch or pull request supersedes a running check.
concurrency:
  # Only a pull request run is superseded by a newer push to its branch. Every push to main keeps its own group (the run id) and
  # is never cancelled or dropped: build.yml promotes a candidate only when check.yml ran green on its commit.
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:           # actions/pull-requests: read only for ci-reuse-pr-run.sh
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A push to main whose tree equals the head of its merged pull request, with a green first-attempt run of this workflow
      # on that head (all jobs), is not checked again (see scripts/ci-reuse-pr-run.sh for the rule). Any doubt or API error means the full run.
      - name: Reuse the pull request run
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-reuse-pr-run.sh check.yml

      # In the uv image of the Dockerfile's uv and Python versions (tags, as there), as the runner's user.
      - name: Lint, format, types, import contracts
        if: steps.reuse.outputs.reuse != 'true'
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e HOME=/tmp -e UV_PROJECT_ENVIRONMENT=/tmp/venv -e UV_PYTHON_DOWNLOADS=never -e UV_LINK_MODE=copy \
            ghcr.io/astral-sh/uv:0.13-python3.13-trixie-slim sh -euc '
              uv sync --frozen --all-packages
              uv run ruff check .
              uv run ruff format --check .
              uv run mypy
              uv run lint-imports'

  test:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:           # actions/pull-requests: read only for ci-reuse-pr-run.sh
      contents: read
      actions: read
      pull-requests: read
    steps:
      # The whole history for a pull request: it selects its tests by the diff to its base commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
          persist-credentials: false

      - name: Reuse the pull request run
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-reuse-pr-run.sh check.yml

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.reuse.outputs.reuse != 'true'

      # Which tests: all of them, or the ones a pull request's change affects (scripts/ci-select-tests.sh). The
      # selector that runs is the base branch's version, never the pull request's own.
      - name: Select the tests
        id: select
        if: steps.reuse.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/ci-select-tests.sh

      # Not as a container job: those run as root, and the suite checks file permissions. The step that runs the
      # whole suite is named "Test suite (full)": ci-reuse-pr-run.sh lets a push to main reuse a pull request run only
      # when that step succeeded in it.
      - name: Test suite (full)
        if: steps.reuse.outputs.reuse != 'true' && steps.select.outputs.mode != 'selected'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          push: false
          provenance: false

      - name: Test suite (selected)
        if: steps.reuse.outputs.reuse != 'true' && steps.select.outputs.mode == 'selected'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          push: false
          provenance: false
          build-args: |
            PYTEST_ARGS=${{ steps.select.outputs.args }}

      - name: Runtime image
        if: steps.reuse.outputs.reuse != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: graph-server:ci
          provenance: false

      - name: Smoke test
        if: steps.reuse.outputs.reuse != 'true'
        run: scripts/smoke_image.sh graph-server:ci

      - name: CI reuse self-test
        if: steps.reuse.outputs.reuse != 'true'
        run: tests/ci-reuse/run.sh

      - name: CI promote self-test
        if: steps.reuse.outputs.reuse != 'true'
        run: tests/ci-promote/run.sh

      - name: CI test selection self-test
        if: steps.reuse.outputs.reuse != 'true'
        run: tests/ci-select/run.sh

      - name: Lint the workflows
        if: steps.reuse.outputs.reuse != 'true'
        run: scripts/lint-workflows.sh

  object-store:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:           # actions/pull-requests: read only for ci-reuse-pr-run.sh
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reuse the pull request run
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-reuse-pr-run.sh check.yml

      # Garage and the test container share a Docker network of their own (no job containers, no `services:`); pytest runs
      # in the uv image of the lint job as the runner's user. The script removes what it started, also on failure.
      - name: Object store integration test (Garage)
        if: steps.reuse.outputs.reuse != 'true'
        run: tests/integration/run_garage.sh --container ghcr.io/astral-sh/uv:0.13-python3.13-trixie-slim
