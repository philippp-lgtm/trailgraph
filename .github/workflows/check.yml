name: check

# The gate on every pull request and every push to main.
#   lint:  ruff, ruff format, mypy and the import contracts (CONTRIBUTING.md, "Development")
#   test:  the whole suite on Linux as a non-root user (the Dockerfile's `test` stage), then
#          the runtime image: it builds, starts, answers /v1/health and its data root verifies
# Both jobs only need Docker on the runner (no job containers, no `services:`), so they also run on
# a self-hosted runner: the repository variable CI_RUNS_ON holds the JSON runs-on value, e.g.
# ["self-hosted","linux"]; unset means ubuntu-24.04.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # In the uv image of the Dockerfile's uv and Python versions, as the runner's user.
      - name: Lint, format, types, import contracts
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e HOME=/tmp -e UV_PROJECT_ENVIRONMENT=/tmp/venv -e UV_PYTHON_DOWNLOADS=never -e UV_LINK_MODE=copy \
            ghcr.io/astral-sh/uv:0.13-python3.13-trixie-slim sh -euc '
              uv sync --frozen --all-packages
              uv run ruff check .
              uv run ruff format --check .
              uv run mypy
              uv run lint-imports'

  test:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Not as a container job: those run as root, and the suite checks file permissions.
      - name: Test suite (Dockerfile target test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          push: false
          provenance: false

      - name: Runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: graph-server:ci
          provenance: false

      - name: Smoke test
        run: |
          docker run -d --name graph-server graph-server:ci
          for _ in $(seq 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' graph-server)
            [ "$state" = healthy ] && break
            sleep 2
          done
          docker exec graph-server python -c \
            "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8470/v1/health', timeout=4).read().decode())"
          docker exec graph-server graph-admin audit verify
          [ "$(docker inspect -f '{{.State.Health.Status}}' graph-server)" = healthy ] \
            || { docker logs graph-server; exit 1; }
