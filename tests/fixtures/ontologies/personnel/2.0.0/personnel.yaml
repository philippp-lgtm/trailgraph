# Toy ontology for markings, 2.0.0: the team is personal data too, the remark changes its
# marking and the marking team_internal is gone.
format: graph_cli.ir/1
module:
  id: personnel
  prefix: ex
  version: 2.0.0
  summary: People and the teams they belong to.

markings:
  personal:
    summary: Personal data of a natural person (contact data, dates).
    description: Visible only to callers that hold this marking.

classes:
  Person:
    summary: A person known to the organization.
    display_prefix: PER
    attributes:
      name:
        summary: Full name.
        type: string
        required: true
        role: label
      email:
        summary: Private e-mail address.
        type: string
        markings: [ex:personal]
      birth_date:
        summary: Date of birth.
        type: date
      team:
        summary: Name of the team the person works in.
        type: string
        markings: [personal]
      remark:
        summary: Remark about the person.
        type: text
        markings: [personal]
  Team:
    summary: A group of people working together.
    display_prefix: TEAM
    attributes:
      name:
        summary: Name of the team.
        type: string
        required: true
        role: label
