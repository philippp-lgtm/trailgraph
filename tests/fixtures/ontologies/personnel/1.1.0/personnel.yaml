# Toy ontology for markings, 1.1.0: a second marking, a new marked attribute, the birth date
# is no longer marked.
format: graph_cli.ir/1
module:
  id: personnel
  prefix: ex
  version: 1.1.0
  summary: People and the teams they belong to.

markings:
  personal:
    summary: Personal data of a natural person (contact data, dates).
    description: Visible only to callers that hold this marking.
  team_internal:
    summary: Notes meant for the team leads only.

classes:
  Person:
    summary: A person known to the organization.
    display_prefix: PER
    attributes:
      name:
        summary: Full name.
        type: string
        required: true
        role: label
      email:
        summary: Private e-mail address.
        type: string
        markings: [ex:personal]
      birth_date:
        summary: Date of birth.
        type: date
      team:
        summary: Name of the team the person works in.
        type: string
      remark:
        summary: Remark about the person.
        type: text
        markings: [team_internal]
  Team:
    summary: A group of people working together.
    display_prefix: TEAM
    attributes:
      name:
        summary: Name of the team.
        type: string
        required: true
        role: label
