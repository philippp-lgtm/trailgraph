format: graph_cli.ir/1
module:
  id: workshop
  prefix: wk
  version: 2.0.0
  summary: The workshop as a whole, the main module that brings its areas together; it keeps the site.
  imports:
    - {module: planning, version: "^1.0"}
    - {module: equipment, version: "^1.0"}

classes:
  Site:
    summary: The place where the workshop is; stays in the main module in 2.0.0.
    display_prefix: SITE
    attributes:
      name:
        summary: Name of the site.
        type: string
        required: true
        role: label
