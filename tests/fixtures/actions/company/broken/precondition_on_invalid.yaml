schema: graph_cli.action/1
name: precondition_on_invalid
module: organization
summary: A probe.
use_when: Testing.
params:
  person:
    type: ref
    class: ppl:Person
    summary: A person.
  position:
    type: ref
    class: org:Position
    summary: A position.
  note:
    type: string
    summary: A note.
preconditions:
  - id: check
    on: note
    summary: A check.
    require:
      - {attr: title, value_presence: PRESENT}
ops:
  - {op: link, id: $person, rel: org:holds, target: $position}
  - {op: update, id: $position, set: {title: $note}}
examples:
  - request: A request.
