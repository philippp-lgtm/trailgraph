schema: graph_cli.action/1
name: invalid_default
module: organization
summary: A probe.
use_when: Testing.
params:
  person:
    type: ref
    class: ppl:Person
    summary: A person.
  position:
    type: ref
    class: org:Position
    summary: A position.
  since:
    type: date
    default: someday
    summary: A date.
ops:
  - {op: link, id: $person, rel: org:holds, target: $position, qualifiers: {since: $since}}
examples:
  - request: A request.
