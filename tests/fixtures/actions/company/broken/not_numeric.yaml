schema: graph_cli.action/1
name: not_numeric
module: organization
summary: A probe.
use_when: Testing.
params:
  person:
    type: ref
    class: ppl:Person
    summary: A person.
  position:
    type: ref
    class: org:Position
    summary: A position.
preconditions:
  - id: check
    on: position
    summary: A check.
    require:
      - {sum: {rel: holds, direction: in, attr: name}, minimum_value: 1}
ops:
  - {op: link, id: $person, rel: org:holds, target: $position}
examples:
  - request: A request.
