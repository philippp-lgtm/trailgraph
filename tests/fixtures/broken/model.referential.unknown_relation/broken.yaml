format: graph_cli.ir/1
module:
  id: broken
  prefix: brk
  version: 1.0.0
  summary: Minimal module with exactly one defect.

classes:
  Thing:
    summary: Something that is tracked.
    attributes:
      label:
        summary: Display label.
        type: string
        required: true

rules:
  - id: has_links
    summary: A thing links to something.
    severity: warning
    when: batch
    scope: Thing
    then:
      - {count: {rel: links}, minimum_value: 1}
