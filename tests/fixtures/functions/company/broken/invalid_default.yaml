schema: graph_cli.function/1
name: invalid_default
module: organization
summary: Positions of a unit.
use_when: Positions that belong to a department or team.
params:
  unit:
    type: ref
    class: org:OrgUnit
    summary: The unit to list.
  since:
    type: string
    default: [first, second]
    summary: Lower bound.
query: |
  MATCH (q:Position)-[:in_unit]->(u:OrgUnit)
  WHERE u.id = $unit AND u.name <> $since
  RETURN q.title AS position
returns:
  - column: position
    summary: The position.
examples:
  - question: Which positions does the support team have?
