schema: graph_cli.function/1
name: returns_type_mismatch
module: organization
summary: Positions of a unit.
use_when: Positions that belong to a department or team.
params:
  unit:
    type: ref
    class: org:OrgUnit
    summary: The unit to list.
query: |
  MATCH (q:Position)-[:in_unit]->(u:OrgUnit)
  WHERE u.id = $unit
  RETURN q.title AS position, count(q) AS positions
  ORDER BY position
returns:
  - column: position
    summary: The title.
  - column: positions
    summary: How many positions carry the title.
    type: string
examples:
  - question: Which positions does the support team have?
