# Workspace root. Not a distribution itself; the three distributions live in
# packages/ (graph_cli: app CLI, graph_cli_admin: maintenance CLI,
# graph_cli_server: HTTP API server).
[project]
name = "graph_cli_workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["graph_cli", "graph_cli_admin", "graph_cli_server"]

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "jsonschema>=4.23",
    "mypy>=1.11",
    "openapi-spec-validator>=0.9",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
    "types-waitress>=3.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
graph_cli = { workspace = true }
graph_cli_admin = { workspace = true }
graph_cli_server = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]
markers = ["slow: builds distributions or spawns many processes"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["graph_cli", "graph_cli_admin", "graph_cli_server"]

[tool.mypy]
strict = true
packages = ["graph_cli", "graph_cli_admin", "graph_cli_server"]

# Dependencies point down only. See the layer table in docs/architecture.md.
[tool.importlinter]
root_packages = ["graph_cli", "graph_cli_admin", "graph_cli_server"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "graph_cli layers"
type = "layers"
layers = [
    "graph_cli.app_cli",
    "graph_cli.skills",
    "graph_cli.cli_kit",
    "graph_cli.catalog",
    "graph_cli.extensions",
    "graph_cli.services",
    "graph_cli.audit | graph_cli.access_control | graph_cli.temporal_knowledge | graph_cli.storage",
    "graph_cli.query",
    "graph_cli.ontology_layer",
    "graph_cli.kernel",
]

[[tool.importlinter.contracts]]
name = "graph_cli_admin layers"
type = "layers"
layers = [
    "graph_cli_admin.maintenance_cli",
    "graph_cli_admin.services_admin",
]

[[tool.importlinter.contracts]]
name = "App distribution never imports the maintenance distribution"
type = "forbidden"
source_modules = ["graph_cli"]
forbidden_modules = ["graph_cli_admin"]

# B14, B14.15, B14.21: the app surface of the server never reaches maintenance code; only
# the admin API module (loaded by main only with [server] admin_api) and the enrollment
# exchange, which writes the token files, import it.
[[tool.importlinter.contracts]]
name = "Only the server's admin API and enrollment import the maintenance distribution"
type = "forbidden"
source_modules = [
    "graph_cli_server.app",
    "graph_cli_server.http_status",
    "graph_cli_server.openapi",
    "graph_cli_server.problems",
    "graph_cli_server.uploads",
]
forbidden_modules = ["graph_cli_admin"]

[[tool.importlinter.contracts]]
name = "App distribution never imports the server distribution"
type = "forbidden"
source_modules = ["graph_cli"]
forbidden_modules = ["graph_cli_server"]

[[tool.importlinter.contracts]]
name = "Only the server distribution uses the WSGI server"
type = "forbidden"
source_modules = ["graph_cli", "graph_cli_admin"]
forbidden_modules = ["waitress"]

# Storage adapters see kernel types only (no ontology semantics, no query
# planning). The query AST lives in the kernel for this reason.
[[tool.importlinter.contracts]]
name = "Storage adapters import only the kernel"
type = "forbidden"
source_modules = ["graph_cli.storage"]
forbidden_modules = [
    "graph_cli.ontology_layer",
    "graph_cli.query",
    "graph_cli.audit",
    "graph_cli.access_control",
    "graph_cli.temporal_knowledge",
    "graph_cli.services",
    "graph_cli.extensions",
    "graph_cli.catalog",
    "graph_cli.cli_kit",
    "graph_cli.app_cli",
]

# The Cypher subset runs over the Snapshot port with the model only: the flag
# planners stay an independent implementation (the equivalence tests compare
# both), and nothing above the query layer leaks in.
[[tool.importlinter.contracts]]
name = "Cypher queries import only the kernel and the ontology layer"
type = "forbidden"
source_modules = ["graph_cli.query.cypher"]
forbidden_modules = [
    "graph_cli.query.plan",
    "graph_cli.query.lookup",
    "graph_cli.storage",
    "graph_cli.audit",
    "graph_cli.access_control",
    "graph_cli.temporal_knowledge",
    "graph_cli.services",
    "graph_cli.extensions",
    "graph_cli.catalog",
    "graph_cli.cli_kit",
    "graph_cli.skills",
    "graph_cli.app_cli",
]

# Skill generators read only the public inventory and model description (B11),
# never the declarations or services behind them.
[[tool.importlinter.contracts]]
name = "Skill generators import only the kernel"
type = "forbidden"
source_modules = ["graph_cli.skills"]
forbidden_modules = [
    "graph_cli.app_cli",
    "graph_cli.cli_kit",
    "graph_cli.catalog",
    "graph_cli.extensions",
    "graph_cli.services",
    "graph_cli.audit",
    "graph_cli.access_control",
    "graph_cli.temporal_knowledge",
    "graph_cli.storage",
    "graph_cli.query",
    "graph_cli.ontology_layer",
]

# Audit events and authorization decisions are pure functions over kernel
# types (contracts B5, B6.4). The layers contract already keeps them apart
# from storage and from everything above them.
[[tool.importlinter.contracts]]
name = "Audit and access control import only the kernel"
type = "forbidden"
source_modules = ["graph_cli.audit", "graph_cli.access_control"]
forbidden_modules = ["graph_cli.ontology_layer", "graph_cli.query"]

# B13.1: the maintenance port is constructed by admin wiring only. Inside the
# app distribution only graph_cli.storage itself may import it.
[[tool.importlinter.contracts]]
name = "Only graph_cli_admin uses the FileStore maintenance port"
type = "forbidden"
source_modules = [
    "graph_cli.app_cli",
    "graph_cli.cli_kit",
    "graph_cli.catalog",
    "graph_cli.extensions",
    "graph_cli.services",
    "graph_cli.audit",
    "graph_cli.access_control",
    "graph_cli.temporal_knowledge",
    "graph_cli.query",
    "graph_cli.ontology_layer",
    "graph_cli.kernel",
]
forbidden_modules = ["graph_cli.storage.files.maintenance"]

# The port is proven by two backends that share only storage.common.
[[tool.importlinter.contracts]]
name = "Storage backends are independent of each other"
type = "independence"
modules = ["graph_cli.storage.memory", "graph_cli.storage.files"]

[[tool.importlinter.contracts]]
name = "The shared storage core imports no backend"
type = "forbidden"
source_modules = ["graph_cli.storage.common"]
forbidden_modules = ["graph_cli.storage.memory", "graph_cli.storage.files"]

[[tool.importlinter.contracts]]
name = "Only CLI layers use the CLI framework"
type = "forbidden"
source_modules = [
    "graph_cli.kernel",
    "graph_cli.ontology_layer",
    "graph_cli.query",
    "graph_cli.storage",
    "graph_cli.audit",
    "graph_cli.access_control",
    "graph_cli.temporal_knowledge",
    "graph_cli.services",
    "graph_cli.extensions",
    "graph_cli.catalog",
    "graph_cli_admin.services_admin",
]
forbidden_modules = ["click"]

# Authored YAML (schema IR, policy) is parsed only by the ontology layer and
# access_control, through the kernel's strict loader; runtime documents are
# canonical JSON (contracts C.7, D4).
[[tool.importlinter.contracts]]
name = "Only the ontology layer and access control parse YAML"
type = "forbidden"
source_modules = [
    "graph_cli.kernel",
    "graph_cli.query",
    "graph_cli.storage",
    "graph_cli.audit",
    "graph_cli.temporal_knowledge",
    "graph_cli.services",
    "graph_cli.extensions",
    "graph_cli.catalog",
    "graph_cli.cli_kit",
    "graph_cli.app_cli",
]
forbidden_modules = ["yaml"]
ignore_imports = ["graph_cli.kernel.yaml_strict -> yaml"]
