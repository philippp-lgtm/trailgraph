<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>graph view</title>
<style>
.viz-root {
  color-scheme: light;
  --surface-1: #fcfcfb;
  --surface-2: #f2f1ee;
  --border: #dedcd6;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #7a7974;
  --node: #52514e;
  --node-inactive: #b5b3ad;
  --link: #cfcdc6;
  --created: #008300;
  --updated: #2a78d6;
  --read: #eda100;
  --read-2: #c4369e;
  --read-3: #0f9fb0;
  --read-4: #7d55e6;
  --read-5: #e0592a;
}
@media (prefers-color-scheme: dark) {
  .viz-root {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --surface-2: #232321;
    --border: #3a3936;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8e86;
    --node: #c3c2b7;
    --node-inactive: #5c5b56;
    --link: #44433f;
    --created: #008300;
    --updated: #3987e5;
    --read: #f0b429;
    --read-2: #e45cc0;
    --read-3: #2cc4d6;
    --read-4: #9c7bff;
    --read-5: #f07a4a;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--surface-1);
  color: var(--text-primary);
  display: flex;
  overflow: hidden;
}
#stage { position: relative; flex: 1; min-width: 0; }
canvas { display: block; width: 100%; height: 100%; cursor: grab; }
canvas.dragging { cursor: grabbing; }
#tooltip {
  position: absolute; pointer-events: none; display: none;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 8px; max-width: 320px; box-shadow: 0 2px 8px rgb(0 0 0 / 0.12);
}
#tooltip .title { font-weight: 600; word-break: break-word; }
#tooltip .meta { color: var(--text-secondary); }
aside {
  width: 360px; flex: none; border-left: 1px solid var(--border);
  background: var(--surface-2); display: flex; flex-direction: column; min-height: 0;
}
aside section { padding: 12px 14px; border-bottom: 1px solid var(--border); }
h1 { font-size: 15px; margin: 0 0 2px; word-break: break-word; }
.muted { color: var(--text-muted); }
.secondary { color: var(--text-secondary); }
.legend { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.legend li, .event { display: flex; align-items: center; gap: 8px; }
.mark { width: 14px; height: 14px; flex: none; }
.ring { fill: none; stroke-width: 2; }
.ring.read { stroke: var(--read); }
.dot.read { fill: var(--read); }
.ring.updated { stroke: var(--updated); }
.ring.created { stroke: var(--created); }
.dot.created { fill: var(--created); }
  .hint { margin-top: 6px; font-size: 12px; }
label.toggle { display: flex; gap: 6px; align-items: center; margin-top: 8px; color: var(--text-secondary); }
#status { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }
#status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
#status.live::before { background: var(--created); }
#events { flex: 1; overflow-y: auto; padding: 8px 14px 14px; margin: 0; list-style: none; }
#events li { padding: 5px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
#events .body { min-width: 0; }
#events .what { word-break: break-word; }
#events .when { color: var(--text-muted); font-size: 12px; }
#search { width: 100%; font: inherit; color: var(--text-primary); background: var(--surface-1); border: 1px solid var(--border); border-radius: 5px; padding: 3px 8px; margin-top: 8px; }
#types { display: grid; gap: 2px; margin-top: 6px; max-height: 140px; overflow-y: auto; }
#types label { display: flex; gap: 6px; align-items: center; color: var(--text-secondary); }
#types .count { color: var(--text-muted); margin-left: auto; }
#matches { margin-top: 4px; font-size: 12px; }
#detail { padding: 10px 14px 12px; border-bottom: 1px solid var(--border); overflow-y: auto; max-height: 55%; flex: none; }
#detail[hidden] { display: none; }
#detail h3 { font-size: 14px; margin: 0; word-break: break-word; }
#detail h4 { font-size: 11px; margin: 12px 0 4px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; }
#detail .meta { color: var(--text-secondary); word-break: break-word; }
#detail dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; }
#detail dt { color: var(--text-muted); }
#detail dd { margin: 0; word-break: break-word; white-space: pre-wrap; min-width: 0; }
#detail ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
#detail li { word-break: break-word; }
#detail .small { font-size: 12px; color: var(--text-muted); }
#detail .close { float: right; }
button, a.button {
  font: inherit; color: var(--text-primary); background: var(--surface-1); text-decoration: none;
  border: 1px solid var(--border); border-radius: 5px; padding: 2px 8px; cursor: pointer;
}
button:hover, a.button:hover { background: var(--surface-2); }
.link { color: var(--updated); cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
.link:hover { text-decoration: underline; }
.actions { display: flex; gap: 6px; margin-top: 6px; }
#events li.clickable { cursor: pointer; }
#events li.clickable:hover { background: var(--surface-1); }
#preview {
  position: absolute; inset: 12px; display: none; flex-direction: column;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: 0 4px 20px rgb(0 0 0 / 0.25);
}
#preview .bar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--border); }
#preview .bar .name { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#preview iframe, #preview img { flex: 1; min-height: 0; width: 100%; border: 0; background: #fff; }
#preview img { object-fit: contain; }
h2 { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin: 12px 14px 0; text-transform: uppercase; letter-spacing: 0.04em; }
button:focus-visible, a.button:focus-visible, input:focus-visible { outline: 2px solid var(--updated); outline-offset: 1px; }
#sidebar {
  width: 240px; flex: none; border-right: 1px solid var(--border);
  background: var(--surface-2); display: flex; flex-direction: column; min-height: 0;
}
#sidebar.collapsed { width: 44px; }
#sidebar .head { display: flex; align-items: center; gap: 8px; padding: 9px; border-bottom: 1px solid var(--border); }
#sidebar .head h2 { margin: 0; }
#sidebar.collapsed .head h2, #sidebar.collapsed #graphs_status { display: none; }
#sidebar_toggle { width: 26px; height: 26px; padding: 0; display: grid; place-items: center; flex: none; }
#sidebar_toggle svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; }
#graph_list { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; display: grid; align-content: start; gap: 2px; }
#graph_list[hidden] { display: none; }
#graph_list button { width: 100%; text-align: left; background: none; border-color: transparent; padding: 6px 8px; }
#graph_list button:hover { background: var(--surface-1); }
#graph_list button[aria-current="true"] { background: var(--surface-1); border-color: var(--border); }
#graph_list .name { display: flex; gap: 6px; align-items: baseline; font-weight: 600; word-break: break-word; }
#graph_list .state { font-size: 11px; font-weight: 400; color: var(--text-muted); }
#graph_list .title { color: var(--text-secondary); font-size: 12px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
#graphs_status { padding: 0 14px 12px; }
#empty { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; }
#empty h1 { font-size: 17px; margin: 0 0 6px; }
#empty p { margin: 0 0 12px; }
body.no-graph #empty { display: grid; }
body.no-graph canvas, body.no-graph #panel { display: none; }
</style>
</head>
<body class="viz-root no-graph">
<nav id="sidebar" aria-labelledby="graphs_heading">
  <div class="head">
    <button id="sidebar_toggle" type="button" aria-expanded="true" aria-controls="graph_list"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><line x1="6" y1="2.5" x2="6" y2="13.5"/></svg></button>
    <h2 id="graphs_heading">Graphs</h2>
  </div>
  <ul id="graph_list"></ul>
  <div id="graphs_status" class="muted hint"></div>
</nav>
<div id="stage">
  <canvas id="canvas" aria-label="Graph: entities as dots, edges as lines"></canvas>
  <div id="empty" role="status">
    <div>
      <h1 id="empty_title">No graph selected</h1>
      <p id="empty_text" class="secondary">Pick a graph from the list on the left.</p>
      <button id="empty_show" type="button" hidden>Show the list of graphs</button>
    </div>
  </div>
  <div id="tooltip" role="tooltip"></div>
  <div id="preview" role="dialog" aria-label="File preview">
    <div class="bar"><span class="name" id="preview_name"></span><button id="preview_close" type="button">Close</button></div>
    <div id="preview_body" style="display:flex;flex:1;min-height:0"></div>
  </div>
</div>
<aside id="panel">
  <section>
    <h1 id="title">graph view</h1>
    <div id="counts" class="muted"></div>
    <div id="status">connecting</div>
  </section>
  <section>
    <ul class="legend">
      <li><svg class="mark" viewBox="0 0 14 14" aria-hidden="true"><circle class="ring created" cx="7" cy="7" r="5"/><circle class="dot created" cx="7" cy="7" r="2"/></svg>created</li>
      <li><svg class="mark" viewBox="0 0 14 14" aria-hidden="true"><circle class="ring updated" cx="7" cy="7" r="5"/></svg>updated</li>
      <li><svg class="mark" viewBox="0 0 14 14" aria-hidden="true"><circle class="ring read" cx="7" cy="7" r="5" opacity="0.4"/><circle class="dot read" cx="7" cy="7" r="3"/></svg>read, one color per session <span id="reads" class="muted"></span></li>
    </ul>
    <label class="toggle"><input id="inactive" type="checkbox" checked> show superseded and retracted</label>
    <input id="search" type="search" placeholder="Search label, alias or type" aria-label="Search">
    <label class="toggle"><input id="scale_nodes" type="checkbox"> scale nodes by number of connections</label>
    <label class="toggle"><input id="only_matches" type="checkbox"> hide entities that do not match</label>
    <div id="matches" class="muted"></div>
    <div id="types" aria-label="Types"></div>
    <div class="muted hint">Drag to pan, wheel to zoom, double-click to fit. Click a node or an edge for details.</div>
  </section>
  <div id="detail" hidden></div>
  <h2>Activity</h2>
  <ul id="events" aria-live="polite"></ul>
</aside>
<script>
"use strict";
const token = new URLSearchParams(location.search).get("t") || "";
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const tooltip = document.getElementById("tooltip");
const statusLine = document.getElementById("status");
const eventList = document.getElementById("events");
const showInactive = document.getElementById("inactive");
const onlyMatches = document.getElementById("only_matches");
const scaleNodes = document.getElementById("scale_nodes");
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

const FLASH_MS = 1500;
// Reads glow: an entity or edge a read touched lights up and fades, and a pulse runs along
// every walked edge, one step after the other, so an agent's walk flickers through the graph.
const GLOW_MS = 900;       // a glow falls to 1/e in this time
const MAX_GLOW = 1.6;      // reads in quick succession add up to this
const PULSE_MS = 380;      // a pulse's travel time along one edge
const STEP_MS = 70;        // the gap between two walked edges of one read
const SPREAD_MS = 1600;    // every step of one read starts within this time
const MAX_PULSES = 800;
const LABEL_LIT = 30;      // up to this many glowing entities show their labels
const SESSION_COLORS = ["read", "read-2", "read-3", "read-4", "read-5"];
const MAX_EVENTS = 30;
const RADIUS = 5;
const MAX_RADIUS = 18;   // radius of the most connected node when scaling by connections

let current = null;      // the shown graph as the URL names it (name or id), or null
let currentId = null;    // its id, once loaded
let generation = 0;      // bumped on every switch: answers for an older graph are dropped
let stream = null;       // the EventSource of the shown graph
let graphList = [];      // the graphs of the side bar: {id, name, title, language, state}
let listed = false;      // the list has been loaded once
let defaultGraph = null; // the graph of --graph, shown when the URL names none
let nodes = new Map();   // id -> {id, label, type, alias, status, x, y, vx, vy, flash, fixed}
let links = new Map();   // edge id -> {id, source, target, rel}
let seq = -1;            // the seq of the loaded graph; events at or below it are in it already
let pending = [];        // events that arrive while the graph loads
let loading = false;
let alpha = 1;           // layout temperature
let view = {x: 0, y: 0, k: 1};
let hover = null;
let hoverLink = null;
let query = "";          // lower-case search text; non-matching entities are dimmed
let hiddenTypes = new Set();
let selected = null;     // {kind: "node", id} or {kind: "link", id}
let colors = {};
let autoFit = true;      // fit the graph into view until the user pans or zooms
let lit = new Set();     // nodes with a glow: node.glow = {e, color}
let litLinks = new Map(); // edge id -> {e, color}
let pulses = [];         // {link, from, to, t0, color, started, arrived}
let sparks = [];         // {node, t0, color}: entities of a read that no walked edge reaches
let sessions = new Map(); // session -> color name, in order of appearance
let ambient = 0;         // 0..1: how much the rest of the graph steps back while reads glow
let lastFrame = performance.now();
const dark = matchMedia("(prefers-color-scheme: dark)");
const LABEL_ALL = 80;    // up to this many visible nodes every label shows
const MIN_ZOOM = 0.02;   // far enough out for a few thousand nodes

function readColors() {
  const style = getComputedStyle(document.body);
  for (const name of ["node", "node-inactive", "link", "created", "updated", ...SESSION_COLORS, "text-primary", "text-secondary", "surface-1"]) {
    colors[name] = style.getPropertyValue("--" + name).trim();
  }
}
readColors();
dark.addEventListener("change", readColors);

// ---- data ------------------------------------------------------------

function matches(node) {
  if (!query) return true;
  return [node.label, node.alias, node.type].some(v => v && v.toLowerCase().includes(query));
}

function visible(node) {
  if (!showInactive.checked && node.status !== "active") return false;
  if (hiddenTypes.has(node.type)) return false;
  return !(query && onlyMatches.checked && !matches(node));
}

function typeName(type) {
  return type.includes(":") ? type.slice(type.lastIndexOf(":") + 1) : type;
}

function refilter() {
  let found = 0;
  if (query) for (const node of nodes.values()) if (visible(node) && matches(node)) found++;
  document.getElementById("matches").textContent = query ? `${found} match${found === 1 ? "" : "es"}` : "";
  alpha = Math.max(alpha, 0.3);
  if (autoFit) fit();
}

function buildTypes() {
  const counts = new Map();
  for (const node of nodes.values()) counts.set(node.type, (counts.get(node.type) || 0) + 1);
  const box = document.getElementById("types");
  box.replaceChildren();
  for (const type of [...counts.keys()].sort()) {
    const label = document.createElement("label");
    const input = document.createElement("input");
    input.type = "checkbox";
    input.checked = !hiddenTypes.has(type);
    input.addEventListener("change", () => {
      if (input.checked) hiddenTypes.delete(type); else hiddenTypes.add(type);
      refilter();
    });
    const name = document.createElement("span");
    name.textContent = typeName(type);
    name.title = type;
    const count = document.createElement("span");
    count.className = "count";
    count.textContent = counts.get(type);
    label.append(input, name, count);
    box.append(label);
  }
}

function placeNear(node, data) {
  const neighbour = data.links.map(l => nodes.get(l.target)).find(Boolean);
  const angle = Math.random() * 2 * Math.PI;
  const base = neighbour || {x: 0, y: 0};
  node.x = base.x + Math.cos(angle) * 30;
  node.y = base.y + Math.sin(angle) * 30;
}

function upsert(data, newLinks) {
  let node = nodes.get(data.id);
  if (!node) {
    node = {vx: 0, vy: 0, flash: null, fixed: false};
    nodes.set(data.id, node);
    placeNear(Object.assign(node, data), {links: newLinks});
    alpha = Math.max(alpha, 0.3);
    buildTypes();
  }
  Object.assign(node, data);
  for (const [id, link] of links) {
    if (link.source === data.id) links.delete(id);
  }
  for (const link of newLinks) links.set(link.id, link);
  return node;
}

function flash(node, kind) {
  node.flash = {kind, t0: performance.now()};
}

function sessionColor(session) {
  const key = session || "";
  if (!sessions.has(key)) sessions.set(key, SESSION_COLORS[sessions.size % SESSION_COLORS.length]);
  return sessions.get(key);
}

function excite(node, color, amount = 1) {
  node.glow = {e: Math.min(MAX_GLOW, (node.glow ? node.glow.e : 0) + amount), color};
  lit.add(node);
}

function exciteLink(link, color) {
  const glow = litLinks.get(link.id);
  litLinks.set(link.id, {e: Math.min(MAX_GLOW, (glow ? glow.e : 0) + 1), color});
}

// One read as a walk: a pulse along each walked edge, in the order the read names them,
// from the end the read names first (the start of a neighbors call, the row's first node);
// the entities no walked edge reaches spark one after the other.
function walk(known, walked, color) {
  const now = performance.now();
  const order = new Map(known.map((node, index) => [node.id, index]));
  const rank = id => order.has(id) ? order.get(id) : Infinity;
  const step = Math.min(STEP_MS, SPREAD_MS / Math.max(1, walked.length));
  const reached = new Set();
  walked.forEach((link, index) => {
    const forward = rank(link.source) <= rank(link.target);
    const from = nodes.get(forward ? link.source : link.target), to = nodes.get(forward ? link.target : link.source);
    reached.add(from.id); reached.add(to.id);
    if (reducedMotion) { excite(from, color); excite(to, color); exciteLink(link, color); return; }
    pulses.push({link, from, to, t0: now + index * step, color, started: false, arrived: false});
  });
  if (pulses.length > MAX_PULSES) pulses.splice(0, pulses.length - MAX_PULSES);
  const rest = known.filter(node => !reached.has(node.id));
  const gap = Math.min(25, 800 / Math.max(1, rest.length));
  rest.forEach((node, index) => {
    if (reducedMotion) excite(node, color);
    else sparks.push({node, t0: now + index * gap, color});
  });
}

// Advances pulses and sparks to ``now`` and lets every glow fade by the time since the last frame.
function animate(now) {
  const dt = Math.max(0, now - lastFrame);
  lastFrame = now;
  const fade = Math.exp(-dt / GLOW_MS);
  for (const node of lit) {
    node.glow.e *= fade;
    if (node.glow.e < 0.02 || nodes.get(node.id) !== node) { node.glow = null; lit.delete(node); }
  }
  for (const [id, glow] of litLinks) {
    glow.e *= fade;
    if (glow.e < 0.02 || !links.has(id)) litLinks.delete(id);
  }
  sparks = sparks.filter(spark => {
    if (now < spark.t0) return true;
    excite(spark.node, spark.color);
    return false;
  });
  pulses = pulses.filter(pulse => {
    if (now < pulse.t0) return true;
    if (!pulse.started) { pulse.started = true; excite(pulse.from, pulse.color, 0.7); }
    if (now - pulse.t0 < PULSE_MS) return true;
    excite(pulse.to, pulse.color);
    exciteLink(pulse.link, pulse.color);
    return false;
  });
  let peak = 0;
  for (const node of lit) peak = Math.max(peak, node.glow.e);
  const target = Math.min(1, peak);
  ambient += (target - ambient) * (1 - Math.exp(-dt / (target > ambient ? 150 : 1200)));
}

function rgba(hex, a) {
  const value = parseInt(hex.replace("#", ""), 16);
  return `rgba(${(value >> 16) & 255}, ${(value >> 8) & 255}, ${value & 255}, ${Math.max(0, Math.min(1, a))})`;
}

// The query of a route of the shown graph; every route is relative, so a proxy may serve
// the page below a path prefix.
function api(path, extra) {
  const params = new URLSearchParams(extra || {});
  if (current) params.set("graph", current);
  params.set("t", token);
  return `${path}?${params}`;
}

async function problem(response) {
  try {
    const body = await response.json();
    if (body && body.message) return body.message;
  } catch (error) { /* not JSON */ }
  return "HTTP " + response.status;
}

async function loadGraph(gen) {
  loading = true;
  let data;
  try {
    const response = await fetch(api("graph"), {cache: "no-store"});
    if (!response.ok) throw new Error(await problem(response));
    data = await response.json();
  } catch (error) {
    if (gen === generation) loading = false;
    throw error;
  }
  if (gen !== generation) return;
  try {
    const old = nodes;
    nodes = new Map();
    links = new Map();
    lit = new Set();
    litLinks = new Map();
    pulses = [];
    sparks = [];
    for (const item of data.nodes) {
      const node = Object.assign({vx: 0, vy: 0, flash: null, fixed: false}, old.get(item.id) || {}, item, {glow: null});
      if (node.x === undefined) {
        const angle = Math.random() * 2 * Math.PI, radius = 40 + Math.random() * 20 * Math.sqrt(data.nodes.length);
        node.x = Math.cos(angle) * radius;
        node.y = Math.sin(angle) * radius;
      }
      nodes.set(item.id, node);
    }
    for (const link of data.links) links.set(link.id, link);
    seq = data.seq;
    currentId = data.graph.id;
    renderGraphs();
    document.title = data.graph.name + " · graph view";
    document.getElementById("title").textContent = data.graph.name;
    document.getElementById("reads").textContent = data.signal_reads ? "" : "(off: [activity] signal_reads)";
    alpha = old.size ? Math.max(alpha, 0.3) : 1;
    updateCounts();
    buildTypes();
    refilter();
  } finally {
    loading = false;
  }
  const queued = pending;
  pending = [];
  queued.forEach(handle);
}

function updateCounts() {
  let active = 0;
  for (const node of nodes.values()) if (node.status === "active") active++;
  document.getElementById("counts").textContent =
    `${active} active · ${nodes.size - active} inactive · ${links.size} edges`;
}

function handle(event) {
  if (loading) { pending.push(event); return; }
  if (event.kind === "created" || event.kind === "updated") {
    if (event.seq <= seq) return;
    const node = upsert(event.node, event.links);
    flash(node, event.kind);
    excite(node, event.kind);
    record(event.kind, node.label, event.actor, node.id);
    updateCounts();
    if (selected && (selected.id === node.id || selectedSource() === node.id)) showSelection();
  } else if (event.kind === "read") {
    const color = sessionColor(event.session);
    const known = event.ids.map(id => nodes.get(id)).filter(Boolean);
    const walked = (event.edges || []).map(id => links.get(id)).filter(l => l && nodes.has(l.source) && nodes.has(l.target));
    walk(known, walked, color);
    if (known.length || walked.length) {
      const what = known.length === 1 ? known[0].label : `${known.length} entities`;
      const along = walked.length ? `, ${walked.length} edge${walked.length === 1 ? "" : "s"}` : "";
      const who = [event.actor, event.session ? `session ${event.session}` : null].filter(Boolean).join(" · ");
      record("read", `${event.command || "read"}: ${what}${along}`, who, known.length === 1 ? known[0].id : null, color);
    }
  } else if (event.kind === "error") {
    setStatus(`error: ${event.message}`, false);
  }
}

function record(kind, label, actor, id, color) {
  const item = document.createElement("li");
  item.className = "event";
  const dot = kind === "created" ? `<circle class="dot created" cx="7" cy="7" r="2"/>`
    : kind === "read" ? `<circle class="dot read" cx="7" cy="7" r="3"/>` : "";
  item.innerHTML = `<svg class="mark" viewBox="0 0 14 14" aria-hidden="true"><circle class="ring ${kind}" cx="7" cy="7" r="5"/>${dot}</svg><div class="body"><div class="what"></div><div class="when"></div></div>`;
  if (color) item.querySelector("svg").style.setProperty("--read", colors[color]);
  item.querySelector(".what").textContent = kind === "read" ? label : `${kind}: ${label}`;
  item.querySelector(".when").textContent = new Date().toLocaleTimeString() + (actor ? ` · ${actor}` : "");
  if (id) {
    item.classList.add("clickable");
    item.addEventListener("click", () => select({kind: "node", id}));
  }
  eventList.prepend(item);
  while (eventList.children.length > MAX_EVENTS) eventList.lastChild.remove();
}

// ---- details ---------------------------------------------------------

const detail = document.getElementById("detail");

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function when(ts) {
  const date = new Date(ts);
  return isNaN(date) ? ts : date.toLocaleString();
}

function url(path, id) {
  return api(path, {id});
}

function size(bytes) {
  if (bytes === null || bytes === undefined) return "";
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KiB";
  return (bytes / 1048576).toFixed(1) + " MiB";
}

function show(value) {
  if (value === null || value === undefined) return "–";
  if (typeof value === "string") return value;
  return JSON.stringify(value, null, 2);
}

function selectedSource() {
  if (!selected || selected.kind !== "link") return null;
  const link = links.get(selected.id);
  return link ? link.source : null;
}

function select(target) {
  selected = target;
  showSelection();
}

function nodeLink(id, label) {
  const button = el("button", "link", label);
  button.type = "button";
  button.addEventListener("click", () => select({kind: "node", id}));
  return button;
}

function qualifiers(values) {
  const keys = Object.keys(values || {});
  return keys.length ? keys.map(k => `${k}: ${show(values[k])}`).join(", ") : "";
}

function closeButton() {
  const button = el("button", "close", "×");
  button.type = "button";
  button.setAttribute("aria-label", "Close details");
  button.addEventListener("click", () => select(null));
  return button;
}

function actorText(actor) {
  if (!actor) return "unknown";
  const parts = [];
  for (const name of ["agent", "principal"]) {
    const facet = actor[name];
    if (facet) parts.push(`${name} ${facet.name || ""}${facet.assurance === "asserted" ? " (asserted)" : ""}`.trim());
  }
  return parts.length ? parts.join(" · ") : actor.label;
}

function historySection(history) {
  const box = el("div");
  box.append(el("h4", null, "History and agents"));
  const list = el("ul");
  for (const item of history) {
    const row = el("li");
    row.append(el("div", null, `rev ${item.rev} · ${item.status} · ${when(item.ts)}`));
    row.append(el("div", "meta", actorText(item.actor)));
    const how = [item.actor && item.actor.session ? `session ${item.actor.session.name || ""}` : null,
      item.actor ? item.actor.client : null, item.command].filter(Boolean).join(" · ");
    if (how) row.append(el("div", "small", how));
    if (item.reason) row.append(el("div", "small", `reason: ${item.reason}`));
    list.append(row);
  }
  box.append(list);
  return box;
}

function edgeList(title, items, outgoing) {
  const box = el("div");
  box.append(el("h4", null, `${title} (${items.length})`));
  if (!items.length) { box.append(el("div", "small", "none")); return box; }
  const list = el("ul");
  for (const item of items) {
    const row = el("li");
    const rel = el("span", "secondary", outgoing ? `${item.rel} → ` : `← ${item.rel} · `);
    row.append(rel, nodeLink(item.other.id, item.other.label));
    const extra = qualifiers(item.qualifiers);
    if (extra) row.append(el("div", "small", extra));
    list.append(row);
  }
  box.append(list);
  return box;
}

function fileSection(d) {
  const box = el("div");
  box.append(el("h4", null, "File"));
  const info = d.file;
  box.append(el("div", "meta", [info.media_type, size(info.size)].filter(Boolean).join(" · ")));
  if (!info.stored) { box.append(el("div", "small", "The stored copy is missing.")); return box; }
  const actions = el("div", "actions");
  if (info.inline) {
    const preview = el("button", null, "Preview");
    preview.type = "button";
    preview.addEventListener("click", () => openPreview(d));
    actions.append(preview);
  }
  const open = el("a", "button", info.inline ? "Open in tab" : "Download");
  open.href = url("blob", d.id);
  open.target = "_blank";
  open.rel = "noopener";
  actions.append(open);
  box.append(actions);
  return box;
}

function renderNode(d) {
  detail.replaceChildren(closeButton(), el("h3", null, d.label));
  detail.append(el("div", "meta", [d.type, d.alias, d.status === "active" ? null : d.status, `rev ${d.rev}`].filter(Boolean).join(" · ")));
  detail.append(el("div", "small", `${d.id}`));
  if (d.file) detail.append(fileSection(d));
  detail.append(el("h4", null, "Attributes"));
  const keys = Object.keys(d.attrs);
  if (!keys.length) detail.append(el("div", "small", "none"));
  else {
    const list = el("dl");
    for (const key of keys) list.append(el("dt", null, key), el("dd", null, show(d.attrs[key])));
    detail.append(list);
  }
  const valid = [d.valid_from ? `from ${d.valid_from}` : null, d.valid_to ? `to ${d.valid_to}` : null].filter(Boolean);
  if (valid.length) detail.append(el("div", "small", `valid ${valid.join(" ")}`));
  detail.append(edgeList("Outgoing edges", d.outgoing, true), edgeList("Incoming edges", d.incoming, false), historySection(d.history));
}

function renderLink(link, source) {
  const a = nodes.get(link.source), b = nodes.get(link.target);
  detail.replaceChildren(closeButton(), el("h3", null, link.rel));
  detail.append(el("div", "meta", "edge"));
  const list = el("dl");
  const from = nodeLink(link.source, a ? a.label : link.source);
  const to = nodeLink(link.target, b ? b.label : link.target);
  const fromDd = el("dd"), toDd = el("dd");
  fromDd.append(from); toDd.append(to);
  list.append(el("dt", null, "from"), fromDd, el("dt", null, "to"), toDd);
  const values = link.qualifiers || {};
  for (const key of Object.keys(values)) list.append(el("dt", null, key), el("dd", null, show(values[key])));
  detail.append(list, el("div", "small", link.id));
  if (source) {
    detail.append(el("h4", null, "Written by (history of the source entity)"));
    detail.append(historySection(source.history).lastChild);
  }
}

async function fetchEntity(id) {
  const response = await fetch(url("entity", id), {cache: "no-store"});
  if (!response.ok) throw new Error(await problem(response));
  return response.json();
}

function closePreview() {
  document.getElementById("preview").style.display = "none";
  document.getElementById("preview_body").replaceChildren();
}

function openPreview(d) {
  const body = document.getElementById("preview_body");
  const media = d.file.media_type || "";
  const node = media.startsWith("image/") ? document.createElement("img") : document.createElement("iframe");
  node.src = url("blob", d.id);
  if (node.tagName === "IMG") node.alt = d.label;
  else node.title = d.label;
  body.replaceChildren(node);
  document.getElementById("preview_name").textContent = d.label;
  document.getElementById("preview").style.display = "flex";
}

async function showSelection() {
  const target = selected;
  closePreview();
  if (!target) { detail.hidden = true; return; }
  detail.hidden = false;
  try {
    if (target.kind === "node") {
      const d = await fetchEntity(target.id);
      if (selected === target) renderNode(d);
    } else {
      const link = links.get(target.id);
      if (!link) { select(null); return; }
      const source = await fetchEntity(link.source).catch(() => null);
      if (selected === target) renderLink(link, source);
    }
  } catch (error) {
    if (selected === target) {
      detail.replaceChildren(closeButton(), el("div", "muted", `cannot load the details: ${error.message}`));
    }
  }
}

document.getElementById("preview_close").addEventListener("click", closePreview);
addEventListener("keydown", event => {
  if (event.key !== "Escape") return;
  if (document.getElementById("preview").style.display === "flex") closePreview();
  else if (selected) select(null);
});

function setStatus(text, live) {
  statusLine.textContent = text;
  statusLine.classList.toggle("live", live);
}

// The stream of the shown graph only: the view sends each graph's events to its own clients.
// Every (re)connect loads the graph again; events up to its seq are in it already.
function connect(gen) {
  const source = new EventSource(api("events"));
  stream = source;
  source.onopen = () => {
    if (gen !== generation) return;
    setStatus("live", true);
    loadGraph(gen).catch(error => { if (gen === generation) failGraph(error); });
  };
  source.onmessage = message => { if (gen === generation) handle(JSON.parse(message.data)); };
  source.onerror = () => {
    if (gen !== generation) return;
    if (source.readyState !== EventSource.CLOSED) { setStatus("reconnecting", false); return; }
    // Refused for good (an unknown graph, a denial; the browser does not retry after an
    // error status): stay closed, and let the graph route say why, once.
    source.close();
    loadGraph(gen).then(() => setStatus("not live, reload the page", false))
      .catch(error => { if (gen === generation) failGraph(error); });
  };
}

const sidebar = document.getElementById("sidebar");
const sidebarToggle = document.getElementById("sidebar_toggle");
const graphListBox = document.getElementById("graph_list");
const graphsStatus = document.getElementById("graphs_status");
const emptyShow = document.getElementById("empty_show");
const SIDEBAR_KEY = "graph-view.sidebar";
const LIST_REFRESH_MS = 60000;

function setSidebar(open, remember) {
  sidebar.classList.toggle("collapsed", !open);
  sidebarToggle.setAttribute("aria-expanded", String(open));
  const label = open ? "Hide the list of graphs" : "Show the list of graphs";
  sidebarToggle.setAttribute("aria-label", label);
  sidebarToggle.title = label;
  graphListBox.hidden = !open;
  emptyShow.hidden = open;
  if (remember) {
    try { localStorage.setItem(SIDEBAR_KEY, open ? "open" : "collapsed"); } catch (error) { /* storage off */ }
  }
}

function isCurrent(graph) {
  return current !== null && (graph.name === current || graph.id === current || graph.id === currentId);
}

let renderedList = "";    // the list the side bar shows, as JSON: rebuilt only when it changed

function renderGraphs() {
  graphsStatus.textContent = listed && !graphList.length ? "No graphs to show." : "";
  const key = JSON.stringify(graphList);
  if (key === renderedList) {  // keep the buttons, so a click in progress or the focus stays
    for (const button of graphListBox.querySelectorAll("button")) {
      const graph = graphList.find(g => g.name === button.dataset.graph);
      if (graph && isCurrent(graph)) button.setAttribute("aria-current", "true");
      else button.removeAttribute("aria-current");
    }
    return;
  }
  renderedList = key;
  const focused = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.graph : null;
  graphListBox.replaceChildren();
  for (const graph of graphList) {
    const item = el("li");
    const button = el("button");
    button.type = "button";
    button.dataset.graph = graph.name;
    if (isCurrent(graph)) button.setAttribute("aria-current", "true");
    const name = el("span", "name", graph.name);
    if (graph.state !== "active") name.append(el("span", "state", graph.state));
    button.append(name);
    if (graph.title) button.append(el("span", "title", graph.title));
    button.title = graph.title ? `${graph.name}: ${graph.title}` : graph.name;
    button.addEventListener("click", () => choose(graph.name));
    item.append(button);
    graphListBox.append(item);
    if (focused === graph.name) button.focus();
  }
}

async function loadGraphs() {
  try {
    const response = await fetch("graphs?t=" + encodeURIComponent(token), {cache: "no-store"});
    if (!response.ok) throw new Error(await problem(response));
    const data = await response.json();
    graphList = data.graphs;
    defaultGraph = data.default;
    listed = true;
    renderGraphs();
    if (!current) showEmpty();
  } catch (error) {
    graphsStatus.textContent = `cannot list the graphs: ${error.message}`;
  }
}

function resetGraph() {
  nodes = new Map();
  links = new Map();
  seq = -1;
  pending = [];
  loading = false;
  lit = new Set();
  litLinks = new Map();
  pulses = [];
  sparks = [];
  sessions = new Map();
  ambient = 0;
  hover = null;
  hoverLink = null;
  showTooltip(null);
  selected = null;
  detail.hidden = true;
  closePreview();
  hiddenTypes = new Set();
  query = "";
  document.getElementById("search").value = "";
  autoFit = true;
  view = {x: 0, y: 0, k: 1};
  alpha = 1;
  currentId = null;
  eventList.replaceChildren();
  for (const id of ["types", "counts", "matches", "reads"]) document.getElementById(id).replaceChildren();
  document.getElementById("title").textContent = current || "graph view";
}

function showEmpty(title, text) {
  document.body.classList.add("no-graph");
  document.getElementById("empty_title").textContent = title || "No graph selected";
  document.getElementById("empty_text").textContent = text
    || (listed && !graphList.length ? "There is no graph you may read." : "Pick a graph from the list on the left.");
}

function failGraph(error) {
  if (stream) { stream.close(); stream = null; }
  setStatus("not live", false);
  showEmpty(`Cannot show ${current}`, error.message);
}

// Shows graph ``name`` (as the URL names it), or none.
function showGraph(name) {
  generation++;
  if (stream) { stream.close(); stream = null; }
  current = name || null;
  resetGraph();
  renderGraphs();
  if (!current) {
    document.title = "graph view";
    setStatus("no graph selected", false);
    showEmpty();
    return;
  }
  document.body.classList.remove("no-graph");
  document.title = current + " · graph view";
  setStatus("connecting", false);
  resize();
  connect(generation);
}

// A graph picked in the side bar: a new history entry, so Back returns to the previous one.
function choose(name) {
  if (name === current) return;
  const params = new URLSearchParams(location.search);
  params.set("graph", name);
  history.pushState(null, "", "?" + params);
  showGraph(name);
}

function wantedGraph() {
  return new URLSearchParams(location.search).get("graph") || defaultGraph;
}

sidebarToggle.addEventListener("click", () => setSidebar(sidebar.classList.contains("collapsed"), true));
emptyShow.addEventListener("click", () => { setSidebar(true, true); sidebarToggle.focus(); });
addEventListener("popstate", () => showGraph(wantedGraph()));
addEventListener("focus", loadGraphs);
setInterval(() => { if (!document.hidden) loadGraphs(); }, LIST_REFRESH_MS);

// ---- layout ----------------------------------------------------------

const REPULSE_RANGE = 300; // nodes further apart do not repel each other
const MAX_STEP = 40;       // the farthest a node moves in one tick

function tick() {
  if (alpha < 0.005) return;
  const list = [...nodes.values()].filter(visible);
  // Repulsion only reaches REPULSE_RANGE, so a grid of that cell size finds every pair in
  // range by looking at a cell and its forward neighbours: about n * neighbours, not n * n.
  const grid = new Map();
  for (const node of list) {
    const cx = Math.floor(node.x / REPULSE_RANGE), cy = Math.floor(node.y / REPULSE_RANGE);
    const key = cx + "," + cy;
    let cell = grid.get(key);
    if (!cell) grid.set(key, cell = {cx, cy, items: []});
    cell.items.push(node);
  }
  const repel = (a, b) => {
    let dx = b.x - a.x, dy = b.y - a.y;
    let d2 = dx * dx + dy * dy;
    if (d2 > REPULSE_RANGE * REPULSE_RANGE) return;
    if (d2 < 1) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 1; }
    const force = (-900 * alpha) / d2;
    a.vx += dx * force; a.vy += dy * force;
    b.vx -= dx * force; b.vy -= dy * force;
  };
  for (const cell of grid.values()) {
    const items = cell.items;
    for (let i = 0; i < items.length; i++) {
      for (let j = i + 1; j < items.length; j++) repel(items[i], items[j]);
    }
    for (const [ox, oy] of [[1, 0], [-1, 1], [0, 1], [1, 1]]) {
      const other = grid.get((cell.cx + ox) + "," + (cell.cy + oy));
      if (!other) continue;
      for (const a of items) for (const b of other.items) repel(a, b);
    }
  }
  const springs = [];
  const degree = new Map();
  for (const link of links.values()) {
    const a = nodes.get(link.source), b = nodes.get(link.target);
    if (!a || !b || a === b || !visible(a) || !visible(b)) continue;
    springs.push([a, b]);
    degree.set(a, (degree.get(a) || 0) + 1);
    degree.set(b, (degree.get(b) || 0) + 1);
  }
  for (const [a, b] of springs) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    const force = ((d - 50) / d) * 0.08 * alpha;
    // Each end takes its share by its edge count: summed over hundreds of edges, the full
    // pull would move a hub past its neighbours and further out on every tick.
    const fa = force / degree.get(a), fb = force / degree.get(b);
    a.vx += dx * fa; a.vy += dy * fa;
    b.vx -= dx * fb; b.vy -= dy * fb;
  }
  for (const node of list) {
    node.vx -= node.x * 0.004 * alpha;
    node.vy -= node.y * 0.004 * alpha;
    if (node.fixed) { node.vx = node.vy = 0; continue; }
    node.vx *= 0.6; node.vy *= 0.6;
    const speed = Math.sqrt(node.vx * node.vx + node.vy * node.vy);
    if (speed > MAX_STEP) { node.vx *= MAX_STEP / speed; node.vy *= MAX_STEP / speed; }
    node.x += node.vx; node.y += node.vy;
  }
  alpha *= 0.985;
}

// ---- drawing ---------------------------------------------------------

function resize() {
  const ratio = devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * ratio;
  canvas.height = canvas.clientHeight * ratio;
}

function toScreen(node) {
  return [canvas.clientWidth / 2 + view.x + node.x * view.k, canvas.clientHeight / 2 + view.y + node.y * view.k];
}

function toWorld(sx, sy) {
  return [(sx - canvas.clientWidth / 2 - view.x) / view.k, (sy - canvas.clientHeight / 2 - view.y) / view.k];
}

function drawFlash(x, y, node, now) {
  const t = (now - node.flash.t0) / FLASH_MS;
  if (t >= 1) { node.flash = null; return; }
  const color = colors[node.flash.kind];
  const grow = reducedMotion ? 0 : t * 10;
  ctx.save();
  ctx.globalAlpha = 1 - t;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.setLineDash(node.flash.kind === "read" ? [4, 3] : []);
  ctx.beginPath();
  ctx.arc(x, y, node.r + 5 + grow, 0, 2 * Math.PI);
  ctx.stroke();
  if (node.flash.kind === "created") {
    ctx.beginPath();
    ctx.arc(x, y, node.r + 10 + grow * 1.6, 0, 2 * Math.PI);
    ctx.stroke();
  }
  ctx.globalAlpha = 0.35 * (1 - t);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, node.r + 4, 0, 2 * Math.PI);
  ctx.fill();
  ctx.restore();
}

function halo(x, y, inner, outer, color, strength) {
  const gradient = ctx.createRadialGradient(x, y, inner, x, y, outer);
  gradient.addColorStop(0, rgba(color, 0.85 * strength));
  gradient.addColorStop(1, rgba(color, 0));
  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(x, y, outer, 0, 2 * Math.PI);
  ctx.fill();
}

function segment(ax, ay, bx, by) {
  ctx.beginPath();
  ctx.moveTo(ax, ay);
  ctx.lineTo(bx, by);
  ctx.stroke();
}

// Glowing edges and the pulses on their way, added up on a dark background.
function drawWalks(now) {
  ctx.save();
  ctx.globalCompositeOperation = dark.matches ? "lighter" : "source-over";
  for (const [id, glow] of litLinks) {
    const link = links.get(id);
    const a = nodes.get(link.source), b = nodes.get(link.target);
    if (!a || !b || !visible(a) || !visible(b)) continue;
    const [ax, ay] = toScreen(a), [bx, by] = toScreen(b);
    const strength = Math.min(1, glow.e), color = colors[glow.color];
    ctx.lineWidth = 6;
    ctx.strokeStyle = rgba(color, 0.22 * strength);
    segment(ax, ay, bx, by);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = rgba(color, 0.9 * strength);
    segment(ax, ay, bx, by);
  }
  for (const pulse of pulses) {
    if (!pulse.started || !visible(pulse.from) || !visible(pulse.to)) continue;
    const t = Math.min(1, (now - pulse.t0) / PULSE_MS);
    const [ax, ay] = toScreen(pulse.from), [bx, by] = toScreen(pulse.to);
    const hx = ax + (bx - ax) * t, hy = ay + (by - ay) * t, color = colors[pulse.color];
    if (Math.hypot(hx - ax, hy - ay) > 1) {
      const trail = ctx.createLinearGradient(ax, ay, hx, hy);
      trail.addColorStop(0, rgba(color, 0));
      trail.addColorStop(1, rgba(color, 0.95));
      ctx.lineWidth = 2;
      ctx.strokeStyle = trail;
      segment(ax, ay, hx, hy);
    }
    halo(hx, hy, 1, 9, color, 1);
  }
  ctx.restore();
}

// Glowing entities on top of the others: a halo that grows with the glow, then a lit core.
function drawGlows() {
  ctx.save();
  for (const node of lit) {
    if (!visible(node)) continue;
    const [x, y] = toScreen(node);
    const strength = Math.min(1, node.glow.e), color = colors[node.glow.color];
    ctx.globalCompositeOperation = dark.matches ? "lighter" : "source-over";
    halo(x, y, node.r * 0.6, node.r + 6 + 16 * strength, color, strength);
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = rgba(color, 0.35 + 0.65 * strength);
    ctx.beginPath();
    ctx.arc(x, y, node.r, 0, 2 * Math.PI);
    ctx.fill();
    if (node.glow.e > 1 && dark.matches) {
      ctx.fillStyle = rgba("#ffffff", 0.8 * (node.glow.e - 1));
      ctx.beginPath();
      ctx.arc(x, y, node.r * 0.5, 0, 2 * Math.PI);
      ctx.fill();
    }
  }
  ctx.restore();
}

// Sets node.r: the base radius, or with scaling a radius relative to the most connected visible node.
function updateRadii() {
  const degree = new Map();
  if (scaleNodes.checked) {
    for (const link of links.values()) {
      const a = nodes.get(link.source), b = nodes.get(link.target);
      if (!a || !b || !visible(a) || !visible(b)) continue;
      degree.set(a.id, (degree.get(a.id) || 0) + 1);
      degree.set(b.id, (degree.get(b.id) || 0) + 1);
    }
  }
  const max = Math.max(1, ...degree.values());
  for (const node of nodes.values()) {
    node.r = RADIUS + (MAX_RADIUS - RADIUS) * Math.sqrt((degree.get(node.id) || 0) / max);
  }
}

function draw(now) {
  updateRadii();
  const ratio = devicePixelRatio || 1;
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
  const base = 1 - 0.45 * ambient;  // the rest steps back while reads glow
  ctx.lineWidth = 1;
  ctx.strokeStyle = colors.link;
  ctx.globalAlpha = base;
  ctx.beginPath();
  for (const link of links.values()) {
    const a = nodes.get(link.source), b = nodes.get(link.target);
    if (!a || !b || !visible(a) || !visible(b)) continue;
    const [ax, ay] = toScreen(a), [bx, by] = toScreen(b);
    ctx.moveTo(ax, ay);
    ctx.lineTo(bx, by);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
  for (const link of [hoverLink, selected && selected.kind === "link" ? links.get(selected.id) : null]) {
    if (!link) continue;
    const a = nodes.get(link.source), b = nodes.get(link.target);
    if (!a || !b || !visible(a) || !visible(b)) continue;
    const [ax, ay] = toScreen(a), [bx, by] = toScreen(b);
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = colors["text-secondary"];
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(bx, by);
    ctx.stroke();
  }
  drawWalks(now);
  ctx.lineWidth = 1;
  const labelled = [];
  let count = 0;
  for (const node of nodes.values()) if (visible(node)) count++;
  const showAllLabels = view.k >= 1.4 || count <= LABEL_ALL;
  for (const node of nodes.values()) {
    if (!visible(node)) continue;
    const [x, y] = toScreen(node);
    const dim = query && !matches(node);
    if (node.flash) drawFlash(x, y, node, now);
    ctx.globalAlpha = (dim ? 0.15 : 1) * base;
    ctx.beginPath();
    ctx.arc(x, y, node.r, 0, 2 * Math.PI);
    if (node.status === "active") {
      ctx.fillStyle = colors.node;
      ctx.fill();
    } else {
      ctx.fillStyle = colors["surface-1"];
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = colors["node-inactive"];
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    if (selected && selected.kind === "node" && selected.id === node.id) {
      ctx.beginPath();
      ctx.arc(x, y, node.r + 4, 0, 2 * Math.PI);
      ctx.lineWidth = 2;
      ctx.strokeStyle = colors["text-primary"];
      ctx.stroke();
    }
    const shown = query ? !dim : showAllLabels;
    const glowing = node.glow && lit.size <= LABEL_LIT;
    if (shown || glowing || node === hover || node.flash || (selected && selected.id === node.id)) labelled.push([x, y, node]);
  }
  drawGlows();
  ctx.font = "12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
  ctx.textBaseline = "middle";
  for (const [x, y, node] of labelled) {
    const text = node.label.length > 40 ? node.label.slice(0, 39) + "…" : node.label;
    ctx.lineWidth = 3;
    ctx.strokeStyle = colors["surface-1"];
    ctx.strokeText(text, x + node.r + 4, y);
    ctx.fillStyle = node.status === "active" ? colors["text-primary"] : colors["text-secondary"];
    ctx.fillText(text, x + node.r + 4, y);
  }
}

function fit() {
  const list = [...nodes.values()].filter(visible);
  if (!list.length) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const node of list) {
    x0 = Math.min(x0, node.x); x1 = Math.max(x1, node.x);
    y0 = Math.min(y0, node.y); y1 = Math.max(y1, node.y);
  }
  const pad = 60, labelRoom = 120;
  const k = Math.min(
    (canvas.clientWidth - 2 * pad - labelRoom) / Math.max(x1 - x0, 1),
    (canvas.clientHeight - 2 * pad) / Math.max(y1 - y0, 1),
    2,
  );
  view.k = Math.max(MIN_ZOOM, k);
  view.x = -((x0 + x1) / 2) * view.k - labelRoom / 2;
  view.y = -((y0 + y1) / 2) * view.k;
}

function frame(now) {
  animate(now);
  tick();
  if (autoFit && alpha >= 0.005) fit();
  draw(now);
  requestAnimationFrame(frame);
}

// ---- interaction -----------------------------------------------------

function nodeAt(sx, sy) {
  let best = null, bestD = Infinity;
  for (const node of nodes.values()) {
    if (!visible(node)) continue;
    const [x, y] = toScreen(node);
    const d = (x - sx) ** 2 + (y - sy) ** 2;
    const reach = Math.max(12, (node.r || RADIUS) + 4);
    if (d < reach * reach && d < bestD) { best = node; bestD = d; }
  }
  return best;
}

function linkAt(sx, sy) {
  let best = null, bestD = 6;
  for (const link of links.values()) {
    const a = nodes.get(link.source), b = nodes.get(link.target);
    if (!a || !b || !visible(a) || !visible(b)) continue;
    const [ax, ay] = toScreen(a), [bx, by] = toScreen(b);
    const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
    const t = len2 ? Math.max(0, Math.min(1, ((sx - ax) * dx + (sy - ay) * dy) / len2)) : 0;
    const d = Math.hypot(sx - (ax + t * dx), sy - (ay + t * dy));
    if (d < bestD) { best = link; bestD = d; }
  }
  return best;
}

function showTooltip(node, sx, sy, link) {
  if (!node && !link) { tooltip.style.display = "none"; return; }
  tooltip.replaceChildren();
  const title = document.createElement("div");
  title.className = "title";
  const meta = document.createElement("div");
  meta.className = "meta";
  if (node) {
    title.textContent = node.label;
    meta.textContent = [node.type, node.alias, node.status === "active" ? null : node.status].filter(Boolean).join(" · ");
  } else {
    const a = nodes.get(link.source), b = nodes.get(link.target);
    title.textContent = link.rel;
    meta.textContent = `${a ? a.label : "?"} → ${b ? b.label : "?"}`;
  }
  tooltip.append(title, meta);
  tooltip.style.display = "block";
  const left = Math.min(sx + 14, canvas.clientWidth - tooltip.offsetWidth - 8);
  tooltip.style.left = Math.max(8, left) + "px";
  tooltip.style.top = Math.max(8, sy + 14) + "px";
}

let drag = null;
canvas.addEventListener("pointerdown", event => {
  const node = nodeAt(event.offsetX, event.offsetY);
  drag = {node, x: event.offsetX, y: event.offsetY, vx: view.x, vy: view.y, moved: false};
  if (!node) autoFit = false;
  if (node) { node.fixed = true; alpha = Math.max(alpha, 0.1); }
  canvas.setPointerCapture(event.pointerId);
  canvas.classList.add("dragging");
});
canvas.addEventListener("pointermove", event => {
  if (drag && Math.hypot(event.offsetX - drag.x, event.offsetY - drag.y) > 4) drag.moved = true;
  if (drag && drag.node) {
    [drag.node.x, drag.node.y] = toWorld(event.offsetX, event.offsetY);
    alpha = Math.max(alpha, 0.1);
  } else if (drag) {
    view.x = drag.vx + event.offsetX - drag.x;
    view.y = drag.vy + event.offsetY - drag.y;
  }
  hover = nodeAt(event.offsetX, event.offsetY);
  hoverLink = hover ? null : linkAt(event.offsetX, event.offsetY);
  showTooltip(hover, event.offsetX, event.offsetY, hoverLink);
});
function endDrag(event) {
  if (drag && drag.node) drag.node.fixed = false;
  if (drag && !drag.moved && event.type === "pointerup") {
    const link = drag.node ? null : linkAt(event.offsetX, event.offsetY);
    if (drag.node) select({kind: "node", id: drag.node.id});
    else if (link) select({kind: "link", id: link.id});
    else if (selected) select(null);
  }
  drag = null;
  canvas.classList.remove("dragging");
}
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);
canvas.addEventListener("pointerleave", () => { hover = null; hoverLink = null; showTooltip(null); });
canvas.addEventListener("wheel", event => {
  event.preventDefault();
  autoFit = false;
  const factor = Math.exp(-event.deltaY * 0.0015);
  const k = Math.min(8, Math.max(MIN_ZOOM, view.k * factor));
  const [wx, wy] = toWorld(event.offsetX, event.offsetY);
  view.k = k;
  view.x = event.offsetX - canvas.clientWidth / 2 - wx * k;
  view.y = event.offsetY - canvas.clientHeight / 2 - wy * k;
}, {passive: false});
canvas.addEventListener("dblclick", () => { autoFit = true; fit(); });
showInactive.addEventListener("change", refilter);
onlyMatches.addEventListener("change", refilter);
scaleNodes.addEventListener("change", () => { alpha = Math.max(alpha, 0.3); });
document.getElementById("search").addEventListener("input", event => {
  query = event.target.value.trim().toLowerCase();
  refilter();
});
document.getElementById("search").addEventListener("keydown", event => {
  if (event.key !== "Enter" || !query) return;
  const first = [...nodes.values()].find(n => visible(n) && matches(n));
  if (first) select({kind: "node", id: first.id});
});
addEventListener("resize", resize);
new ResizeObserver(resize).observe(canvas);

let storedSidebar = null;
try { storedSidebar = localStorage.getItem(SIDEBAR_KEY); } catch (error) { /* storage off */ }
setSidebar(storedSidebar !== "collapsed", false);
resize();
// A graph named in the URL opens at once; else the list says which one --graph named.
if (new URLSearchParams(location.search).get("graph")) {
  showGraph(wantedGraph());
  loadGraphs();
} else {
  showGraph(null);
  loadGraphs().then(() => { if (!current && defaultGraph) showGraph(defaultGraph); });
}
requestAnimationFrame(frame);
</script>
</body>
</html>
