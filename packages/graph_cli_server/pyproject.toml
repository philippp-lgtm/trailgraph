[project]
name = "graph_cli_server"
version = "0.1.0.dev0"
description = "Domain-agnostic knowledge graph shell: HTTP API server (graph-server)."
requires-python = ">=3.12"
dependencies = ["graph_cli", "graph_cli_admin", "waitress>=3.0.2"]

[project.scripts]
graph-server = "graph_cli_server.main:main"

[tool.uv.sources]
graph_cli = { workspace = true }
graph_cli_admin = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
