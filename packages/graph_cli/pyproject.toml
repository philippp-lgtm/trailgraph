[project]
name = "graph_cli"
version = "0.22.0"
description = "Domain-agnostic knowledge graph shell: application CLI (graph)."
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0.2",
]

[project.scripts]
graph = "graph_cli.app_cli.main:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
